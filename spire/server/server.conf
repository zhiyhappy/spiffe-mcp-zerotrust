server {
    bind_address        = "0.0.0.0"
    bind_port           = "8081"
    trust_domain        = "ethandemo.com"
    data_dir            = "/opt/spire/data/server"
    log_level           = "DEBUG"

    ca_ttl              = "24h"
    default_x509_svid_ttl = "1h"
    default_jwt_svid_ttl  = "5m"

    # Issuer embedded in JWT-SVIDs; must match the public OIDC discovery URL
    # served by Caddy so external verifiers (e.g. Azure federation) accept them.
    jwt_issuer          = "https://spiffe.ethandemo.com"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type     = "sqlite3"
            connection_string = "/opt/spire/data/server/datastore.sqlite3"
        }
    }

    # Single-node demo: agents join with a one-time server-generated token.
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/opt/spire/data/server/keys.json"
        }
    }
}

health_checks {
    listener_enabled = true
    bind_address     = "0.0.0.0"
    bind_port        = "8080"
    live_path        = "/live"
    ready_path       = "/ready"
}
