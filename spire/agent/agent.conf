agent {
    data_dir           = "/opt/spire/data/agent"
    log_level          = "DEBUG"
    server_address     = "spire-server"
    server_port        = "8081"
    trust_domain       = "ethandemo.com"

    # Shared Workload API / SDS socket consumed by the Envoy sidecars.
    socket_path        = "/tmp/spire-sockets/api.sock"

    # Demo convenience: skip trust-bundle bootstrapping. In production, provide
    # the server's trust bundle instead (trust_bundle_path / trust_bundle_url).
    insecure_bootstrap = true
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }

    # Persist the agent SVID so restarts re-attest without a fresh join token.
    KeyManager "disk" {
        plugin_data {
            directory = "/opt/spire/data/agent"
        }
    }

    # Label verification: maps a calling container to a SPIFFE ID by its docker
    # labels (e.g. docker:label:app:openwebui). Requires /var/run/docker.sock
    # and pid:host on the agent container.
    WorkloadAttestor "docker" {
        plugin_data {
            docker_socket_path = "unix:///var/run/docker.sock"
        }
    }

    WorkloadAttestor "unix" {
        plugin_data {}
    }
}
