log_level = "debug"

# Public host where Caddy publishes the discovery document + JWKS. Determines the
# "issuer" in /.well-known/openid-configuration -> https://spiffe.ethandemo.com
domains = ["spiffe.ethandemo.com"]

# Serve over a unix socket; Caddy terminates public TLS and reverse-proxies here.
listen_socket_path    = "/run/oidc/server.sock"
allow_insecure_scheme = true   # safe only because the socket is local to the trusted proxy

# Pull the JWT signing keys (JWKS) from SPIRE via the agent Workload API.
workload_api {
    socket_path  = "/tmp/spire-sockets/api.sock"
    trust_domain = "ethandemo.com"
}
