# Envoy CLIENT sidecar (AI Agent stack).
# Accepts plain HTTP from Open WebUI on :10000 and forwards it to the MCP server's
# Envoy over mTLS, presenting SVID spiffe://ethandemo.com/agent and requiring the
# peer to be spiffe://ethandemo.com/mcp-server. Certs are fetched live via SDS
# from the SPIRE agent (no keys on disk).
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 19000 }

static_resources:
  listeners:
    - name: outbound
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: egress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: mcp
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: mcp_mtls, timeout: 0s }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # SPIRE agent SDS endpoint (shared UDS).
    - name: spire_agent
      connect_timeout: 1s
      http2_protocol_options: {}
      load_assignment:
        cluster_name: spire_agent
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    pipe: { path: /tmp/spire-sockets/api.sock }

    # Upstream MCP Envoy, secured with SPIFFE mTLS. The server sidecar shares the
    # MCP container's netns, so its mTLS listener is reachable as mcp-server:9000.
    - name: mcp_mtls
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: mcp_mtls
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: mcp-server, port_value: 9000 }
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          common_tls_context:
            tls_certificate_sds_secret_configs:
              - name: "spiffe://ethandemo.com/agent"
                sds_config:
                  resource_api_version: V3
                  api_config_source:
                    api_type: GRPC
                    transport_api_version: V3
                    grpc_services:
                      - envoy_grpc: { cluster_name: spire_agent }
            combined_validation_context:
              default_validation_context:
                match_typed_subject_alt_names:
                  - san_type: URI
                    matcher: { exact: "spiffe://ethandemo.com/mcp-server" }
              validation_context_sds_secret_config:
                name: "spiffe://ethandemo.com"
                sds_config:
                  resource_api_version: V3
                  api_config_source:
                    api_type: GRPC
                    transport_api_version: V3
                    grpc_services:
                      - envoy_grpc: { cluster_name: spire_agent }
