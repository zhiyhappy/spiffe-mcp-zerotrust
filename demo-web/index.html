<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPIFFE / SPIRE 零信任演示</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2530; --border:#30363d;
    --ink:#e6edf3; --muted:#8b949e; --blue:#3b82f6; --green:#22c55e;
    --red:#ef4444; --amber:#f59e0b; --node:#21262d; --nodeln:#3d4451;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
    "Microsoft YaHei",Helvetica,Arial,sans-serif;line-height:1.5;
    display:flex;flex-direction:column;overflow:hidden}
  header{padding:12px 24px;border-bottom:1px solid var(--border);
    display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;flex:0 0 auto}
  header h1{font-size:18px;margin:0}
  header .dom{color:var(--muted);font-size:13px}
  header .warn{margin-left:auto;color:var(--amber);font-size:12px}

  .wrap{flex:1 1 auto;min-height:0;display:flex;gap:16px;padding:16px 24px}
  @media(max-width:1000px){.wrap{flex-direction:column;overflow:auto}}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;
    display:flex;flex-direction:column;min-height:0}
  .left{flex:1.55 1 0;min-width:0}
  .right{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:16px}

  /* ---------- topology ---------- */
  .topo{padding:12px}
  .topo svg{flex:1 1 auto;width:100%;height:100%;min-height:0;display:block}
  .node rect{fill:var(--node);stroke:var(--nodeln);stroke-width:1.8;
    transition:all .25s ease}
  .node .t{fill:var(--ink);font-size:19px;font-weight:600}
  .node .s{fill:var(--muted);font-size:14px}
  .node .id{fill:#79c0ff;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .node.active rect{stroke:var(--blue);stroke-width:3;
    filter:drop-shadow(0 0 7px rgba(59,130,246,.75))}
  .node.bad rect{stroke:var(--red);stroke-width:3;
    filter:drop-shadow(0 0 7px rgba(239,68,68,.75))}
  .node.ok rect{stroke:var(--green);stroke-width:3;
    filter:drop-shadow(0 0 7px rgba(34,197,94,.75))}
  .edge{stroke:var(--nodeln);stroke-width:1.8;fill:none;opacity:.5;
    transition:all .25s ease}
  .edge.hidden{opacity:0}
  .edge.active{stroke:var(--blue);stroke-width:3.4;opacity:1;
    stroke-dasharray:8 5;animation:dash 1s linear infinite}
  .edge.bad{stroke:var(--red);stroke-width:3.4;opacity:1;
    stroke-dasharray:8 5;animation:dash 1s linear infinite}
  .edge.ok{stroke:var(--green);stroke-width:3.4;opacity:1;
    stroke-dasharray:8 5;animation:dash 1s linear infinite}
  .elabel{fill:var(--muted);font-size:13px}
  @keyframes dash{to{stroke-dashoffset:-26}}
  .legend{display:flex;gap:18px;padding:8px 4px 0;font-size:12.5px;color:var(--muted);
    flex-wrap:wrap;flex:0 0 auto}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:22px;height:3px;border-radius:2px;display:inline-block}

  /* ---------- stepper ---------- */
  .step{flex:0 0 auto}
  .step-head{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
  .badge{background:var(--panel2);border:1px solid var(--border);border-radius:20px;
    padding:3px 12px;font-size:13px;color:var(--ink);font-weight:600}
  .step-head .sid{color:var(--muted);font-size:12px;font-family:ui-monospace,Menlo,monospace}
  .step h2{font-size:18px;margin:10px 16px 6px}
  .step p{margin:0 16px 12px;color:var(--muted);font-size:14px}
  .cmd{margin:0 16px;background:#0b0f14;border:1px solid var(--border);
    border-radius:8px;padding:10px 12px;font-family:ui-monospace,SFMono-Regular,
    Menlo,Consolas,monospace;font-size:13px;color:#a5d6ff;white-space:pre-wrap;
    word-break:break-all}
  .cmd .lbl{color:var(--muted);user-select:none}
  .controls{display:flex;gap:8px;padding:14px 16px;flex-wrap:wrap;align-items:center}
  button{font:inherit;font-size:14px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel2);color:var(--ink);padding:9px 16px;cursor:pointer}
  button:hover:not(:disabled){border-color:var(--muted)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  .prog{color:var(--muted);font-size:13px;margin-left:auto}

  .outcard{flex:1 1 auto;min-height:0}
  .out-head{padding:14px 16px 6px;display:flex;align-items:center}
  .out-head .lbl{font-size:13px;color:var(--muted)}
  .verdict{display:flex;align-items:center;gap:8px;font-size:14px;
    padding:0 16px 8px;min-height:22px}
  .verdict .dot{width:10px;height:10px;border-radius:50%}
  .v-ok{color:var(--green)} .v-ok .dot{background:var(--green)}
  .v-warn{color:var(--amber)} .v-warn .dot{background:var(--amber)}
  .v-run{color:var(--blue)} .v-run .dot{background:var(--blue);
    animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.3}}
  pre.out{flex:1 1 auto;min-height:0;background:#0b0f14;border:1px solid var(--border);
    border-radius:8px;margin:0 16px 16px;padding:14px;overflow:auto;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;
    color:#d1d9e0;white-space:pre-wrap;word-break:break-word}
  pre.out:empty::before{content:"点击「下一步 ▶」运行本步骤,结果显示在这里。";color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>SPIFFE / SPIRE 零信任演示</h1>
  <span class="dom" id="dom"></span>
  <span class="warn">⚠ 请仅通过 NSG 源地址白名单访问本页(可执行真实命令)</span>
</header>

<div class="wrap">
  <!-- ===================== topology ===================== -->
  <div class="card left topo">
    <svg viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet"
         role="img" aria-label="demo topology">
      <!-- edges (drawn first, under nodes) -->
      <path id="e-srv-agent"   class="edge" d="M135 100 L135 196"/>
      <path id="e-agent-oidc"  class="edge" d="M135 262 L135 356"/>
      <path id="e-oidc-caddy"  class="edge" d="M135 416 L135 468"/>
      <path id="e-agent-app"   class="edge" d="M232 220 L388 156"/>
      <path id="e-agent-mcp"   class="edge" d="M232 250 L388 366"/>
      <path id="e-app-mcp"     class="edge" d="M520 214 L520 334"/>
      <path id="e-app-entra"   class="edge" d="M652 160 L758 150"/>
      <path id="e-caddy-entra" class="edge" d="M232 498 C 470 600, 700 540, 760 182"/>
      <path id="e-hacker-mcp"  class="edge" d="M758 366 L652 378"/>
      <path id="e-mcp-entra"   class="edge hidden" d="M652 356 L766 186"/>

      <!-- edge labels -->
      <text class="elabel" x="144" y="152">节点认证 / 签发</text>
      <text class="elabel" x="144" y="314">JWKS</text>
      <text class="elabel" x="250" y="182">SVID / SDS</text>
      <text class="elabel" x="250" y="324">SVID / SDS</text>
      <text class="elabel" x="530" y="280">mTLS</text>
      <text class="elabel" x="656" y="128">JWT-SVID</text>
      <text class="elabel" x="470" y="560">JWKS(公网)</text>
      <text class="elabel" x="660" y="398">被拒</text>

      <!-- nodes -->
      <g class="node" id="n-spire-server" data-id="spire-server">
        <rect x="30" y="34" width="210" height="66" rx="9"/>
        <text class="t" x="135" y="64" text-anchor="middle">SPIRE Server</text>
        <text class="s" x="135" y="86" text-anchor="middle">身份权威 · 注册即授权</text>
      </g>
      <g class="node" id="n-spire-agent" data-id="spire-agent">
        <rect x="30" y="196" width="210" height="66" rx="9"/>
        <text class="t" x="135" y="226" text-anchor="middle">SPIRE Agent</text>
        <text class="s" x="135" y="248" text-anchor="middle">工作负载认证 · SDS</text>
      </g>
      <g class="node" id="n-oidc" data-id="oidc">
        <rect x="30" y="356" width="210" height="60" rx="9"/>
        <text class="t" x="135" y="384" text-anchor="middle">OIDC Discovery</text>
        <text class="s" x="135" y="404" text-anchor="middle">发布 JWKS</text>
      </g>
      <g class="node" id="n-caddy" data-id="caddy">
        <rect x="30" y="468" width="210" height="60" rx="9"/>
        <text class="t" x="135" y="496" text-anchor="middle">Caddy</text>
        <text class="s" x="135" y="516" text-anchor="middle">公网 TLS 边缘</text>
      </g>
      <g class="node" id="n-app" data-id="app">
        <rect x="388" y="120" width="264" height="94" rx="9"/>
        <text class="t" x="520" y="152" text-anchor="middle">Open WebUI + envoy-client</text>
        <text class="s" x="520" y="176" text-anchor="middle">AI Agent 侧</text>
        <text class="id" x="520" y="196" text-anchor="middle">spiffe://ethandemo.com/agent</text>
      </g>
      <g class="node" id="n-mcp" data-id="mcp">
        <rect x="388" y="334" width="264" height="94" rx="9"/>
        <text class="t" x="520" y="366" text-anchor="middle">MCP Server + envoy-server</text>
        <text class="s" x="520" y="390" text-anchor="middle">工具 / 数据侧</text>
        <text class="id" x="520" y="410" text-anchor="middle">spiffe://ethandemo.com/mcp-server</text>
      </g>
      <g class="node" id="n-entra" data-id="entra">
        <rect x="758" y="110" width="212" height="84" rx="9"/>
        <text class="t" x="864" y="142" text-anchor="middle">Microsoft Entra ID</text>
        <text class="s" x="864" y="166" text-anchor="middle">工作负载联邦</text>
        <text class="s" x="864" y="184" text-anchor="middle">(零客户端密钥)</text>
      </g>
      <g class="node" id="n-hacker" data-id="hacker">
        <rect x="758" y="334" width="212" height="72" rx="9"/>
        <text class="t" x="864" y="366" text-anchor="middle">Hacker</text>
        <text class="s" x="864" y="388" text-anchor="middle">无 sidecar · 无 SVID</text>
      </g>
    </svg>
    <div class="legend">
      <span><i style="background:var(--blue)"></i>正常路径 / 高亮</span>
      <span><i style="background:var(--red)"></i>被拒 / 撤销</span>
      <span><i style="background:var(--green)"></i>恢复</span>
    </div>
  </div>

  <!-- ===================== stepper ===================== -->
  <div class="right">
    <div class="card step">
      <div class="step-head">
        <span class="badge" id="stepno">步骤 — / —</span>
        <span class="sid" id="stepid"></span>
      </div>
      <h2 id="title">准备就绪</h2>
      <p id="desc">点击「下一步 ▶」开始演示。每一步都会在本机执行真实命令,
        并在下方显示原始输出;左侧拓扑图会高亮当前涉及的组件。</p>
      <div class="cmd" id="cmd"><span class="lbl"># 命令将在此显示</span></div>
      <div class="controls">
        <button class="primary" id="next">下一步 ▶</button>
        <button id="prev" disabled>◀ 上一步</button>
        <button id="rerun" disabled>↻ 重跑本步</button>
        <button id="reset">⟲ 重置</button>
        <span class="prog" id="prog"></span>
      </div>
    </div>

    <div class="card outcard">
      <div class="out-head"><span class="lbl"># 命令输出</span></div>
      <div class="verdict" id="verdict"></div>
      <pre class="out" id="out"></pre>
    </div>
  </div>
</div>

<script>
let STEPS = [], DOMAIN = "";
let cur = -1;                    // pointer into STEPS; -1 = intro
const cache = {};               // step id -> last {output, verdict}
const $ = id => document.getElementById(id);

async function boot(){
  const r = await fetch("/api/steps");
  const j = await r.json();
  STEPS = j.steps; DOMAIN = j.domain || "";
  $("dom").textContent = DOMAIN ? "trust domain: ethandemo.com · " + DOMAIN : "";
  updateNav();
}

function clearHighlight(){
  // Removing the state classes reverts each edge to its base style; the
  // impostor-only edge keeps its `hidden` class and stays invisible until a
  // step adds a state class to it.
  document.querySelectorAll(".node").forEach(n=>n.classList.remove("active","bad","ok"));
  document.querySelectorAll(".edge").forEach(e=>e.classList.remove("active","bad","ok"));
}

function applyHighlight(step){
  clearHighlight();
  const cls = step.edge === "bad" ? "bad" : step.edge === "ok" ? "ok" : "active";
  (step.nodes||[]).forEach(id=>{ const el=$("n-"+id); if(el) el.classList.add(cls); });
  (step.edges||[]).forEach(id=>{ const el=$(id); if(el) el.classList.add(cls); });
}

function renderStep(i, {run=false}={}){
  cur = i;
  if(i < 0){
    $("title").textContent = "准备就绪";
    $("desc").textContent = "点击「下一步 ▶」开始演示。";
    $("cmd").innerHTML = '<span class="lbl"># 命令将在此显示</span>';
    $("out").textContent = ""; $("verdict").innerHTML = "";
    clearHighlight(); updateNav(); return;
  }
  const s = STEPS[i];
  $("stepno").textContent = `步骤 ${i+1} / ${STEPS.length}`;
  $("stepid").textContent = s.id;
  $("title").textContent = s.title;
  $("desc").textContent = s.desc;
  $("cmd").innerHTML = '<span class="lbl">$ </span>' + escapeHtml(s.cmd);
  applyHighlight(s);
  if(cache[s.id]){
    $("out").textContent = cache[s.id].output;
    showVerdict(cache[s.id].verdict);
  } else {
    $("out").textContent = "";
    $("verdict").innerHTML = "";
  }
  updateNav();
  if(run) execStep();
}

function verdictFor(s, output){
  const exp = s.expect;
  if(!exp || !exp.contains) return null;
  const hay = exp.ci ? output.toLowerCase() : output;
  // contains may be a single string or an array (all must be present).
  const needles = Array.isArray(exp.contains) ? exp.contains : [exp.contains];
  const ok = needles.every(n => hay.includes(exp.ci ? n.toLowerCase() : n));
  return { ok: ok, label: exp.label || ("包含 “"+needles.join(" + ")+"”") };
}

function showVerdict(v){
  const el = $("verdict");
  if(!v){ el.innerHTML=""; return; }
  if(v.running){ el.className="verdict v-run"; el.innerHTML='<span class="dot"></span>正在执行…'; return; }
  if(v.ok){ el.className="verdict v-ok"; el.innerHTML='<span class="dot"></span>✓ 符合预期 · '+escapeHtml(v.label); }
  else { el.className="verdict v-warn"; el.innerHTML='<span class="dot"></span>⚠ 未见预期输出 · 期望 '+escapeHtml(v.label); }
}

let busy = false;
async function execStep(){
  if(cur < 0 || busy) return;
  const s = STEPS[cur];
  busy = true; updateNav();
  showVerdict({running:true});
  $("out").textContent = "";
  try{
    const r = await fetch("/api/run", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({step: s.id})
    });
    const j = await r.json();
    const output = (j.output || "").trimEnd() || "(无输出)";
    const v = verdictFor(s, j.output || "");
    $("out").textContent = output;
    if(v) showVerdict(v); else $("verdict").innerHTML = "";
    cache[s.id] = { output, verdict: v };
  }catch(e){
    $("out").textContent = "请求失败: " + e;
    $("verdict").innerHTML = "";
  }finally{
    busy = false; updateNav();
  }
}

function updateNav(){
  $("prog").textContent = cur>=0 ? `${cur+1}/${STEPS.length}` : "";
  $("next").disabled  = busy || cur >= STEPS.length-1;
  $("prev").disabled  = busy || cur <= 0;
  $("rerun").disabled = busy || cur < 0;
  $("reset").disabled = busy;
  $("next").textContent = (cur >= STEPS.length-1 && cur>=0) ? "已完成" : "下一步 ▶";
}

function escapeHtml(s){return (s||"").replace(/[&<>"]/g,c=>(
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

$("next").onclick  = ()=>{ if(cur < STEPS.length-1) renderStep(cur+1, {run:true}); };
$("prev").onclick  = ()=>{ if(cur > 0) renderStep(cur-1); };
$("rerun").onclick = ()=> execStep();
$("reset").onclick = ()=>{ for(const k in cache) delete cache[k]; renderStep(-1); };

boot();
</script>
</body>
</html>
